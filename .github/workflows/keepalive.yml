name: Keep database awake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: https://buvvkcrctqexempzcmus.supabase.co
          KEY: sb_publishable_5voLV8TOWyNO5tkx7pV6Ng_kGU_BaKD
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            [ "$code" = "200" ] && echo "OK" && exit 0
            sleep 30
          done
          echo "Supabase не отвечает (HTTP $code) — зайдите в панель Supabase и нажмите Restore"
          exit 1

      # GitHub отключает расписание в репозитории без активности 60 дней — продлеваем его сами
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
